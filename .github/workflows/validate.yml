name: Validate static site

# Builds the migration branch. It does not deploy.
# GitHub Pages production remains the main branch root until a later approval.

on:
  push:
    branches:
      - website-2027
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build offline from snapshots
        run: npm run build

      - name: Test build output
        run: npm run test:dist
