name: Refresh editorial snapshots

# Daily Google Sheets snapshot refresh for production (main).
# Validates feeds before replacing snapshots. Last-known-good policy lives in
# npm run refresh-feeds. Commits only when public editorial data changes
# (not merely fetchedAt). GITHUB_TOKEN commits do not re-trigger Deploy;
# this workflow explicitly dispatches deploy.yml when snapshots change.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # Daily 06:00 UTC

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh validated feed snapshots
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install
        run: npm ci

      - name: Refresh feeds
        run: npm run refresh-feeds

      - name: Detect meaningful snapshot changes
        id: changes
        run: |
          if git diff --quiet -- src/data/feeds; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- src/data/feeds
          fi

      - name: Commit updated snapshots
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/feeds
          git commit -m "Refresh validated Google Sheets feed snapshots."
          git push origin HEAD:main

      - name: Dispatch production deployment
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
            });
