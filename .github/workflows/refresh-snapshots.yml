name: Refresh editorial snapshots

# Optional Google Sheets snapshot refresh. Scheduling stays commented out
# until the owner explicitly approves automatic runs.
# Uses the default GITHUB_TOKEN so commits from this workflow do not
# re-trigger other workflows (including Deploy). Run Deploy manually or
# push an ordinary human commit to main if a production rebuild is needed
# after a bot snapshot commit.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'  # Optional daily 06:00 UTC — enable only after approval

permissions:
  contents: write

concurrency:
  group: refresh-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh validated feed snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install
        run: npm ci

      - name: Refresh feeds
        run: npm run refresh-feeds

      - name: Detect snapshot changes
        id: changes
        run: |
          if git diff --quiet -- src/data/feeds; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- src/data/feeds
          fi

      - name: Commit updated snapshots
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/feeds
          git commit -m "Refresh validated Google Sheets feed snapshots."
          git push
